<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobby</title>
<style>
:root{--bg:#0b0b14;--panel:#12121f;--line:#3a3a5c;--gold:#ffc933;--green:#3ddc84;--text:#e8e8f5;--mute:#9a9ab8;--bad:#ff5c7a;
--t0:#8a8a9a;--t1:#3ddc84;--t2:#4aa8ff;--t3:#b266ff;--t4:#ffc933}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#06060c;color:var(--text);font:15px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.screen{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:3px solid var(--line)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:3px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:18px;color:var(--gold)}
.online{color:var(--green)}
#status{padding:6px 14px;color:var(--mute);border-bottom:3px solid var(--line)}
#status:empty{display:none}
#join{padding:22px 14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
#join p{margin:0;color:var(--mute)}
label{font-weight:700}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--panel);color:var(--text);border:3px solid var(--line);padding:10px;font:inherit;border-radius:0}
button{background:var(--gold);color:#0b0b14;border:3px solid var(--gold);padding:10px 14px;font:inherit;font-weight:700;border-radius:0;cursor:pointer}
button.ghost{background:transparent;color:var(--gold)}
button.link{background:none;border:0;color:var(--gold);padding:4px 0;text-decoration:underline;text-align:left;font-weight:400}
button:active{transform:translate(2px,2px)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--bad);min-height:1.4em}
#chat{flex:1;min-height:0;display:flex;flex-direction:column}
#me{padding:8px 14px;border-bottom:3px solid var(--line);display:flex;flex-direction:column;gap:6px}
#me .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#bar{height:8px;border:2px solid var(--line);background:var(--panel)}
#fill{height:100%;width:0;background:var(--t0)}
#secure{padding:10px 14px;border-bottom:3px solid var(--line);display:flex;flex-direction:column;gap:8px}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{border-left:3px solid var(--t0);padding-left:8px;overflow-wrap:anywhere}
.m b{color:var(--t0)}
.m time{color:var(--mute);margin-left:6px;font-size:12px}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;margin-right:6px;color:#0b0b14;background:var(--t0)}
.t1{--c:var(--t1)}.t2{--c:var(--t2)}.t3{--c:var(--t3)}.t4{--c:var(--t4)}.t0{--c:var(--t0)}
.m[class*=" t"]{border-left-color:var(--c)}.m[class*=" t"] b{color:var(--c)}
.bd.t0,.bd.t1,.bd.t2,.bd.t3,.bd.t4{background:var(--c)}
.m.me{background:#161628}
.m.sys{border-left-color:var(--bad);color:var(--bad)}
.m.up{border-left-color:var(--c);color:var(--c);font-weight:700}
#send{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:3px solid var(--line);background:var(--panel)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="screen">
  <header>
    <h1>Lobby</h1>
    <span class="online"><span id="count">0</span> online</span>
  </header>
  <div id="status" role="status"></div>

  <form id="join" autocomplete="off">
    <label for="handle" id="joinTitle">Pick a handle</label>
    <p id="joinHint">3 to 16 letters, numbers or underscores.</p>
    <input id="handle" maxlength="17" autocapitalize="off" spellcheck="false" placeholder="@yourname">
    <input id="pass" type="password" maxlength="128" placeholder="Password" autocomplete="current-password" hidden>
    <div class="row"><button id="enter" type="submit">Enter lobby</button></div>
    <button type="button" id="toggle" class="link">I already have a password</button>
    <div id="joinErr" class="err" role="alert"></div>
  </form>

  <section id="chat" hidden>
    <div id="me">
      <div class="top">
        <span><span id="myBadge" class="bd t0">NEW</span><b id="myName"></b></span>
        <span id="myPts"></span>
      </div>
      <div id="bar" aria-hidden="true"><div id="fill"></div></div>
      <button type="button" id="secureBtn" class="link" hidden>Protect my handle with a password</button>
    </div>
    <form id="secure" autocomplete="off" hidden>
      <label for="newpass">Choose a password (8 or more characters)</label>
      <div class="row">
        <input id="newpass" type="password" maxlength="128" autocomplete="new-password">
        <button type="submit">Save</button>
        <button type="button" id="secureCancel" class="ghost">Cancel</button>
      </div>
      <div id="secureErr" class="err" role="alert"></div>
    </form>
    <div id="log" role="log" aria-live="polite"></div>
    <form id="send" class="row" autocomplete="off">
      <input id="text" maxlength="300" placeholder="Say something" aria-label="Message">
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TIERS = ['Newbie', 'Regular', 'Insider', 'Elite', 'Legend'];
  const ABBR = ['NEW', 'REG', 'INS', 'ELT', 'LGD'];
  const STARTS = [0, 300, 2000, 10000, 40000];

  const joinForm = $('join'), chat = $('chat'), log = $('log'), statusEl = $('status'),
        countEl = $('count'), joinErr = $('joinErr'), enter = $('enter'), text = $('text'),
        handleEl = $('handle'), passEl = $('pass'), secure = $('secure');

  // For testing the web app from another address: ?server=wss://your-server/ws
  const WS_URL = new URLSearchParams(location.search).get('server') ||
    ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');

  const MESSAGES = {
    handle_taken: 'That handle is taken. Try another one.',
    bad_handle: 'Use 3 to 16 letters, numbers or underscores.',
    bad_login: 'Wrong handle or password.',
    too_many_attempts: 'Too many tries. Wait a few minutes.',
    session_expired: 'Your session ended. Pick a handle or log in again.',
    slow_down: 'Slow down a little.',
    too_long: 'That message is too long.',
    weak_password: 'Use at least 8 characters.',
    has_password: 'This handle already has a password.',
    server_busy: 'The server is busy. Try again in a moment.',
    bad_hello: 'Something went wrong. Reload the page.'
  };

  // The token lives in localStorage so a closed tab or a restarted phone keeps you signed in.
  let ws = null, token = localStorage.getItem('lobby.k') || '', me = '', wantHandle = '', wantPass = '', loginMode = false;
  let lastId = 0, retry = 0, retryTimer = 0, pingTimer = 0, heard = 0, joined = false;

  function setStatus(s) { statusEl.textContent = s; }
  const tierOf = r => Math.min(Math.max(r | 0, 0), 4);

  function showChat() {
    joined = true;
    joinForm.hidden = true;
    chat.hidden = false;
    text.focus();
  }

  function showJoin(msg) {
    joined = false;
    chat.hidden = true;
    joinForm.hidden = false;
    enter.disabled = false;
    joinErr.textContent = msg || '';
    setStatus('');
    (loginMode ? passEl : handleEl).focus();
  }

  function setMode(login) {
    loginMode = login;
    passEl.hidden = !login;
    $('joinTitle').textContent = login ? 'Log in' : 'Pick a handle';
    $('joinHint').textContent = login ? 'Use the handle and password you saved.' : '3 to 16 letters, numbers or underscores.';
    enter.textContent = login ? 'Log in' : 'Enter lobby';
    $('toggle').textContent = login ? 'I am new here' : 'I already have a password';
    joinErr.textContent = '';
  }

  function updateMe(m) {
    const t = tierOf(m.r);
    const badge = $('myBadge');
    badge.className = 'bd t' + t;
    badge.textContent = ABBR[t];
    $('myName').textContent = '@' + me;
    $('myName').style.color = 'var(--t' + t + ')';
    const next = m.x || 0;
    $('myPts').textContent = TIERS[t] + ' · ' + m.p + (next ? ' / ' + next : '') + ' pts' + (m.s ? ' · day ' + m.s : '');
    const pct = next ? Math.min(100, Math.round((m.p - STARTS[t]) / (next - STARTS[t]) * 100)) : 100;
    $('fill').style.width = pct + '%';
    $('fill').style.background = 'var(--t' + t + ')';
    $('secureBtn').hidden = !!m.g;
    if (m.g) secure.hidden = true;
  }

  function addMessage(m) {
    if (m.i <= lastId) return;
    lastId = m.i;
    const t = tierOf(m.r);
    const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    const div = document.createElement('div');
    div.className = 'm t' + t + (m.h === me ? ' me' : '');
    const badge = document.createElement('span');
    badge.className = 'bd t' + t;
    badge.textContent = ABBR[t];
    const who = document.createElement('b');
    who.textContent = '@' + m.h;
    const when = document.createElement('time');
    when.textContent = new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const body = document.createElement('div');
    body.textContent = m.b;
    const head = document.createElement('div');
    head.append(badge, who, when);
    div.append(head, body);
    log.append(div);
    trim();
    if (near) log.scrollTop = log.scrollHeight;
  }

  function addLine(cls, s) {
    const div = document.createElement('div');
    div.className = 'm ' + cls;
    div.textContent = s;
    log.append(div);
    trim();
    log.scrollTop = log.scrollHeight;
  }
  function trim() { while (log.children.length > 200) log.firstChild.remove(); }

  function onFrame(m) {
    switch (m.t) {
      case 'ok':
        token = m.k; me = m.h;
        localStorage.setItem('lobby.k', token);
        retry = 0;
        setStatus('');
        updateMe(m);
        showChat();
        startPing();
        break;
      case 'me': updateMe(m); break;
      case 'hist': m.m.forEach(addMessage); break;
      case 'm': addMessage(m); break;
      case 'n': countEl.textContent = m.c; break;
      case 'up': addLine('up t' + tierOf(m.r), '@' + m.h + ' reached ' + TIERS[tierOf(m.r)]); break;
      case 'pwok':
        secure.hidden = true;
        $('newpass').value = '';
        addLine('up t1', 'Your handle is now protected. Log in with it on any device.');
        break;
      case 'err':
        if (m.c === 'session_expired') {
          token = ''; localStorage.removeItem('lobby.k');
          showJoin(MESSAGES.session_expired);
        } else if (joined) {
          const text = MESSAGES[m.c] || 'Not done.';
          if (!secure.hidden && (m.c === 'weak_password' || m.c === 'has_password' || m.c === 'server_busy')) $('secureErr').textContent = text;
          else addLine('sys', text);
        } else {
          showJoin(MESSAGES[m.c] || 'Could not join.');
        }
        break;
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    if (ws) { ws.onopen = ws.onmessage = ws.onclose = null; try { ws.close(); } catch (e) {} }
    setStatus(retry ? 'Reconnecting...' : 'Connecting...');
    const sock = new WebSocket(WS_URL);
    ws = sock;
    sock.onopen = () => {
      heard = Date.now();
      const hello = token ? { t: 'hi', k: token, l: lastId }
        : loginMode ? { t: 'login', h: wantHandle, p: wantPass }
        : { t: 'hi', h: wantHandle };
      sock.send(JSON.stringify(hello));
    };
    sock.onmessage = ev => {
      if (sock !== ws) return;
      heard = Date.now();
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      onFrame(m);
    };
    sock.onclose = () => {
      if (sock !== ws) return;
      stopPing();
      if (token) scheduleRetry();
      else if (!joined && !joinErr.textContent) showJoin('Could not connect. Try again.');
    };
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    const wait = Math.min(8000, 500 * 2 ** Math.min(retry, 4));
    retry++;
    setStatus('Offline. Retrying in ' + Math.max(1, Math.round(wait / 1000)) + 's');
    retryTimer = setTimeout(connect, wait);
  }

  // A phone can lose the network without telling the page, and background tabs freeze timers.
  // So we also check the connection the moment the page comes back, and drop it if the server is silent.
  function probe() {
    if (!token) return;
    if (!ws || ws.readyState > 1) { retry = 0; connect(); return; }
    if (ws.readyState !== 1) return;
    const sock = ws, sentAt = Date.now();
    sock.send('{"t":"p"}');
    setTimeout(() => { if (sock === ws && heard < sentAt && sock.readyState <= 1) { retry = 0; sock.close(); connect(); } }, 4000);
  }
  function startPing() {
    stopPing();
    pingTimer = setInterval(() => {
      if (!ws || ws.readyState !== 1) return;
      if (Date.now() - heard > 45000) { retry = 0; ws.close(); connect(); return; }
      ws.send('{"t":"p"}');
    }, 15000);
  }
  function stopPing() { clearInterval(pingTimer); }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') probe(); });
  window.addEventListener('pageshow', probe);
  window.addEventListener('focus', probe);
  window.addEventListener('online', probe);

  $('toggle').addEventListener('click', () => setMode(!loginMode));

  joinForm.addEventListener('submit', e => {
    e.preventDefault();
    const h = handleEl.value.trim().replace(/^@/, '');
    if (!/^[A-Za-z0-9_]{3,16}$/.test(h)) { joinErr.textContent = MESSAGES.bad_handle; return; }
    if (loginMode && !passEl.value) { joinErr.textContent = 'Enter your password.'; return; }
    wantHandle = h;
    wantPass = passEl.value;
    token = '';
    joinErr.textContent = '';
    enter.disabled = true;
    connect();
  });

  $('send').addEventListener('submit', e => {
    e.preventDefault();
    const s = text.value.trim();
    if (!s) return;
    if (!ws || ws.readyState !== 1) { setStatus('Offline. Your message was not sent.'); probe(); return; }
    ws.send(JSON.stringify({ t: 'm', b: s }));
    text.value = '';
    text.focus();
  });

  $('secureBtn').addEventListener('click', () => { secure.hidden = false; $('secureErr').textContent = ''; $('newpass').focus(); });
  $('secureCancel').addEventListener('click', () => { secure.hidden = true; });
  secure.addEventListener('submit', e => {
    e.preventDefault();
    const p = $('newpass').value;
    if (p.length < 8) { $('secureErr').textContent = MESSAGES.weak_password; return; }
    $('secureErr').textContent = '';
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'pw', p }));
    else $('secureErr').textContent = 'Offline. Try again when you are connected.';
  });

  if (token) { showChat(); connect(); } else { showJoin(''); }
})();
</script>
</body>
</html>
